<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Improved Bookmarks</title>
    <link rel="stylesheet" href="sidebar.css">
</head>
<body>
<div id="app">
    <div id="toolbar">
        <button id="btn-back" class="btn-primary" style="display:none">← Back</button>
        <span id="toolbar-title" style="display: block">My Collections</span>
        <button id="btn-new-collection" class="btn-primary">+ New Collection</button>
        <button id="btn-menu" class="btn-icon" title="Menu">⋮</button>
        <div id="toolbar-menu" style="display:none">
            <button id="btn-export"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> Export</button>
            <button id="btn-import"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Import</button>
        </div>
    </div>
<input type="file" id="input-import" accept=".json" style="display:none">
    <div id="collections-list">

    </div>

    <div id="collection-view" style="display:none">
        <div id="collection-toolbar">
            <input type="text" id="input-filter" placeholder="Filter...">
            <button id="btn-add-item" class="btn-primary">+ Add current page</button>
        </div>
        <div id="add-item-modal" style="display:none">
            <div id="modal-content">
                <h3 id="modal-title"></h3>
                <div id="modal-screenshot-wrap">
                    <img id="modal-screenshot" src="" alt="screenshot"/>
                    <button id="btn-recapture" style="display:none"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg> Recapture</button>
                </div>
                <input type="text" id="input-title" placeholder="Title"/>
                <textarea id="input-note" placeholder="Note (optional)"></textarea>
                <div id="modal-buttons">
                    <button id="btn-cancel" class="btn-secondary">Cancel</button>
                    <button id="btn-save" class="btn-primary">Save</button>
                </div>
            </div>
        </div>
        <div id="items-list"></div>
    </div>

</div>
<script type="module" src="sidebar.js"></script>
</body>
</html>
